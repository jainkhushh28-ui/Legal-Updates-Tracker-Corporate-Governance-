name: Collect official legal updates

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CHANGED: installs from requirements-collector.txt, not requirements.txt.
      # requirements.txt is now reserved for the Streamlit app only (which
      # runs on a different Python version and never needs Playwright at
      # all) - mixing the two caused Streamlit Cloud's deploy to fail
      # outright, since Playwright's "greenlet" dependency cannot build on
      # Streamlit Cloud's Python version. Keeping them as two separate files
      # means each environment only installs what it actually uses.
      - run: pip install -r requirements-collector.txt

      # Playwright's Python package (installed above via requirements-collector.txt)
      # only gives us the code to CONTROL a browser - it doesn't include the
      # actual browser itself. This step downloads a real headless Chromium
      # browser onto the GitHub Actions runner, and --with-deps also installs
      # the underlying Linux system libraries (fonts, graphics libraries etc.)
      # that Chromium needs to actually run on this bare Ubuntu machine.
      # Without this step, "from playwright.sync_api import sync_playwright"
      # would work fine, but launching the browser would fail.
      - run: playwright install chromium --with-deps

      - run: python collector.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          git commit -m "Update legal updates data" || echo "No changes to commit"
          git push
